# Generated by tools/ci/render-browser-workflow.mjs; do not edit.
name: Browser compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-chromium
            os: ubuntu-24.04
            architecture: x64
            emacs: "30.2"
            browser: chromium
          - name: linux-firefox
            os: ubuntu-24.04
            architecture: x64
            emacs: "30.2"
            browser: firefox
          - name: linux-webkit
            os: ubuntu-24.04
            architecture: x64
            emacs: "30.2"
            browser: webkit
          - name: linux-arm64-chromium
            os: ubuntu-24.04-arm
            architecture: arm64
            emacs: "30.2"
            browser: chromium
          - name: linux-arm64-firefox
            os: ubuntu-24.04-arm
            architecture: arm64
            emacs: "30.2"
            browser: firefox
          - name: linux-arm64-webkit
            os: ubuntu-24.04-arm
            architecture: arm64
            emacs: "30.2"
            browser: webkit
          - name: macos-chromium
            os: macos-15
            architecture: arm64
            emacs: "30.2"
            browser: chromium
          - name: macos-firefox
            os: macos-15
            architecture: arm64
            emacs: "30.2"
            browser: firefox
          - name: macos-webkit
            os: macos-15
            architecture: arm64
            emacs: "30.2"
            browser: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master@2026-08-28
        with:
          version: ${{ matrix.emacs }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install Node
        run: |
          case "$(uname -s)" in
            Linux) node_platform=linux ;;
            Darwin) node_platform=darwin ;;
            *) exit 1 ;;
          esac
          node_version=24.20.0
          node_archive="node-v$node_version-$node_platform-${{ matrix.architecture }}.tar.gz"
          node_directory="$RUNNER_TEMP/eliscript-node"
          mkdir -p "$node_directory"
          cd "$node_directory"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-max-time 60 "https://nodejs.org/dist/v$node_version/$node_archive" --output "$node_archive"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-max-time 60 "https://nodejs.org/dist/v$node_version/SHASUMS256.txt" --output SHASUMS256.txt
          awk -v file="$node_archive" '$2 == file { print }' SHASUMS256.txt > node.sha256
          test -s node.sha256
          shasum -a 256 -c node.sha256
          tar -xzf "$node_archive"
          echo "$node_directory/node-v$node_version-$node_platform-${{ matrix.architecture }}/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          uname -a
          emacs --version
          bun --version
          node --version
          test "$(bun -p 'process.arch')" = "${{ matrix.architecture }}"
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          test "$(node --version)" = "v24.20.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Bootstrap maintained compiler and backend tools
        run: make bootstrap-backends
      - name: Install selected browser
        run: bun node_modules/playwright-core/cli.js install --with-deps "${{ matrix.browser }}"
      - name: Run complete backend differential suite (performance reacceptance deferred)
        shell: bash
        env:
          ELISCRIPT_TEST_BROWSER: ${{ matrix.browser }}
          DEBUG: pw:browser
          ELISCRIPT_DEFER_PERFORMANCE_ACCEPTANCE: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/eliscript-browser-ci"
          bun test tests/direct-wasm-backend.test.mjs tests/wasm-managed-array-search.test.mjs tests/wasm-managed-array-construction.test.mjs tests/wasm-managed-object-properties.test.mjs tests/wasm-managed-exceptions-browser.test.mjs tests/wasm-managed-symbols.test.mjs 2>&1 | tee "$RUNNER_TEMP/eliscript-browser-ci/tests.log"
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/eliscript-browser-ci/
          if-no-files-found: warn
