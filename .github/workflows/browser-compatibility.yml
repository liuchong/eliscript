# Generated by tools/ci/render-browser-workflow.mjs; do not edit.
name: Browser compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-browsers
            os: ubuntu-24.04
            architecture: x64
            emacs: "32.0.50"
            emacsCommit: "fd7afced4036fc1a221567d70705d20a2bd64713"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Emacs source build prerequisites
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y build-essential autoconf automake texinfo libncurses-dev pkg-config
              ;;
            Darwin)
              brew install autoconf automake texinfo
              echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
              ;;
            *) exit 1 ;;
          esac
      - name: Build pinned Emacs from source
        env:
          EMACS_SOURCE: https://github.com/emacs-mirror/emacs
          EMACS_COMMIT: ${{ matrix.emacsCommit }}
        run: |
          git init "$RUNNER_TEMP/emacs-src"
          git -C "$RUNNER_TEMP/emacs-src" remote add origin "$EMACS_SOURCE"
          git -C "$RUNNER_TEMP/emacs-src" fetch --depth 1 origin "$EMACS_COMMIT"
          git -C "$RUNNER_TEMP/emacs-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/emacs-src" rev-parse HEAD)" = "$EMACS_COMMIT"
          cd "$RUNNER_TEMP/emacs-src"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/emacs-install" --without-x --without-ns --without-native-compilation --without-gnutls
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          echo "$RUNNER_TEMP/emacs-install/bin" >> "$GITHUB_PATH"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install Node
        run: |
          case "$(uname -s)" in
            Linux) node_platform=linux ;;
            Darwin) node_platform=darwin ;;
            *) exit 1 ;;
          esac
          node_version=24.20.0
          node_archive="node-v$node_version-$node_platform-${{ matrix.architecture }}.tar.gz"
          node_directory="$RUNNER_TEMP/eliscript-node"
          mkdir -p "$node_directory"
          cd "$node_directory"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-max-time 60 "https://nodejs.org/dist/v$node_version/$node_archive" --output "$node_archive"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-max-time 60 "https://nodejs.org/dist/v$node_version/SHASUMS256.txt" --output SHASUMS256.txt
          awk -v file="$node_archive" '$2 == file { print }' SHASUMS256.txt > node.sha256
          test -s node.sha256
          shasum -a 256 -c node.sha256
          tar -xzf "$node_archive"
          echo "$node_directory/node-v$node_version-$node_platform-${{ matrix.architecture }}/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          uname -a
          emacs --version
          test "$(emacs --version | head -n 1)" = "GNU Emacs ${{ matrix.emacs }}"
          bun --version
          node --version
          test "$(bun -p 'process.arch')" = "${{ matrix.architecture }}"
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          test "$(node --version)" = "v24.20.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Bootstrap maintained compiler and backend tools
        run: make bootstrap-backends
      - name: Install selected browsers
        run: bun node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Run complete backend differential suite (chromium) (performance reacceptance deferred)
        id: chromium
        shell: bash
        env:
          ELISCRIPT_TEST_BROWSER: chromium
          DEBUG: pw:browser
          ELISCRIPT_DEFER_PERFORMANCE_ACCEPTANCE: "1"
          ELISCRIPT_TEST_FIXTURE_PRELOAD: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/eliscript-browser-ci/chromium"
          bun tools/testing/file-workers.mjs tests/direct-wasm-backend.test.mjs tests/wasm-managed-array-search.test.mjs tests/wasm-managed-array-construction.test.mjs tests/wasm-managed-object-properties.test.mjs tests/wasm-managed-exceptions-browser.test.mjs tests/wasm-managed-symbols.test.mjs 2>&1 | tee "$RUNNER_TEMP/eliscript-browser-ci/chromium/tests.log"
      - name: Run complete backend differential suite (firefox) (performance reacceptance deferred)
        if: "!cancelled() && steps.chromium.outcome != 'skipped'"
        shell: bash
        env:
          ELISCRIPT_TEST_BROWSER: firefox
          DEBUG: pw:browser
          ELISCRIPT_DEFER_PERFORMANCE_ACCEPTANCE: "1"
          ELISCRIPT_TEST_FIXTURE_PRELOAD: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/eliscript-browser-ci/firefox"
          bun tools/testing/file-workers.mjs tests/direct-wasm-backend.test.mjs tests/wasm-managed-array-search.test.mjs tests/wasm-managed-array-construction.test.mjs tests/wasm-managed-object-properties.test.mjs tests/wasm-managed-exceptions-browser.test.mjs tests/wasm-managed-symbols.test.mjs 2>&1 | tee "$RUNNER_TEMP/eliscript-browser-ci/firefox/tests.log"
      - name: Run complete backend differential suite (webkit) (performance reacceptance deferred)
        if: "!cancelled() && steps.chromium.outcome != 'skipped'"
        shell: bash
        env:
          ELISCRIPT_TEST_BROWSER: webkit
          DEBUG: pw:browser
          ELISCRIPT_DEFER_PERFORMANCE_ACCEPTANCE: "1"
          ELISCRIPT_TEST_FIXTURE_PRELOAD: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/eliscript-browser-ci/webkit"
          bun tools/testing/file-workers.mjs tests/direct-wasm-backend.test.mjs tests/wasm-managed-array-search.test.mjs tests/wasm-managed-array-construction.test.mjs tests/wasm-managed-object-properties.test.mjs tests/wasm-managed-exceptions-browser.test.mjs tests/wasm-managed-symbols.test.mjs 2>&1 | tee "$RUNNER_TEMP/eliscript-browser-ci/webkit/tests.log"
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/eliscript-browser-ci/
          if-no-files-found: warn
