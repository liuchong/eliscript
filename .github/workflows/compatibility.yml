# Generated by tools/ci/render-workflow.mjs from contracts/compatibility-matrix.json.
# Run `bun tools/ci/render-workflow.mjs --write` after changing the contract.
name: Compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BUN_TEST_RUNNER: tools/testing/file-workers.mjs --shard-index ${{ matrix.shard }} --shard-count 2
      ELISCRIPT_DEFER_PERFORMANCE_ACCEPTANCE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-emacs-29.4-shard-1-of-2
            os: ubuntu-24.04
            architecture: x64
            emacs: "29.4"
            shard: 1
          - name: linux-emacs-29.4-shard-2-of-2
            os: ubuntu-24.04
            architecture: x64
            emacs: "29.4"
            shard: 2
          - name: linux-emacs-30.2-shard-1-of-2
            os: ubuntu-24.04
            architecture: x64
            emacs: "30.2"
            shard: 1
          - name: linux-emacs-30.2-shard-2-of-2
            os: ubuntu-24.04
            architecture: x64
            emacs: "30.2"
            shard: 2
          - name: macos-emacs-29.4-shard-1-of-2
            os: macos-15
            architecture: arm64
            emacs: "29.4"
            shard: 1
          - name: macos-emacs-29.4-shard-2-of-2
            os: macos-15
            architecture: arm64
            emacs: "29.4"
            shard: 2
          - name: macos-emacs-30.2-shard-1-of-2
            os: macos-15
            architecture: arm64
            emacs: "30.2"
            shard: 1
          - name: macos-emacs-30.2-shard-2-of-2
            os: macos-15
            architecture: arm64
            emacs: "30.2"
            shard: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master@2026-08-28
        with:
          version: ${{ matrix.emacs }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install Node
        run: |
          case "$(uname -s)" in
            Linux) node_platform=linux ;;
            Darwin) node_platform=darwin ;;
            *) exit 1 ;;
          esac
          node_version=24.20.0
          node_archive="node-v$node_version-$node_platform-${{ matrix.architecture }}.tar.gz"
          node_directory="$RUNNER_TEMP/eliscript-node"
          mkdir -p "$node_directory"
          cd "$node_directory"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-max-time 60 "https://nodejs.org/dist/v$node_version/$node_archive" --output "$node_archive"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-max-time 60 "https://nodejs.org/dist/v$node_version/SHASUMS256.txt" --output SHASUMS256.txt
          awk -v file="$node_archive" '$2 == file { print }' SHASUMS256.txt > node.sha256
          test -s node.sha256
          shasum -a 256 -c node.sha256
          tar -xzf "$node_archive"
          echo "$node_directory/node-v$node_version-$node_platform-${{ matrix.architecture }}/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          uname -a
          emacs --version
          bun --version
          node --version
          test "$(node --version)" = "v24.20.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Run test file shard ${{ matrix.shard }}/2 (performance reacceptance deferred)
        run: bun run test
      - name: Strict byte compilation
        run: make byte-compile
