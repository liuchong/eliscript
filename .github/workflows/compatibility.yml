# Generated by tools/ci/render-workflow.mjs from contracts/compatibility-matrix.json.
# Run `bun tools/ci/render-workflow.mjs --write` after changing the contract.
name: Compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-emacs-29.4
            os: ubuntu-24.04
            architecture: x64
            emacs: "29.4"
          - name: linux-emacs-30.2
            os: ubuntu-24.04
            architecture: x64
            emacs: "30.2"
          - name: macos-emacs-29.4
            os: macos-15
            architecture: arm64
            emacs: "29.4"
          - name: macos-emacs-30.2
            os: macos-15
            architecture: arm64
            emacs: "30.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master@2026-08-28
        with:
          version: ${{ matrix.emacs }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Record toolchain
        run: |
          uname -a
          emacs --version
          bun --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run complete test suite
        run: bun run test
      - name: Strict byte compilation
        run: make byte-compile
