# Publishes the documentation site, including the browser playground.
#
# The site lives under `docs/`, and the playground in it loads the compiler,
# the runtime, and the compile host from the repository root two levels above
# the page. Publishing only `docs/` would ship a page whose imports cannot
# resolve, so the artifact keeps the repository shape for the trees the site
# needs. `tools/pages/assemble.mjs` owns that layout and
# `tests/pages-assembly.test.mjs` verifies it against the page's own references.
#
# Deployment is gated on the repository variable `ELISCRIPT_PAGES` so a
# repository without Pages enabled for Actions reports a build rather than a
# failed deployment. To publish, set the repository variable to `true` and set
# Settings, Pages, Source to "GitHub Actions". See `docs/releasing.md`.

name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "browser/**"
      - "platform/**"
      - "runtime/**"
      - "compiler/**"
      - "bootstrap/**"
      - "stdlib/**"
      - "examples/browser-playground/**"
      # The generated proving-ground site is part of the artifact.
      - "examples/dogfood/**"
      - "tools/pages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble the site artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - name: Build the compiler, the browser bundle, and the playground
        run: |
          ./bin/eliscript-bootstrap
          bun run build:browser
          bun run build:browser-playground
          bun run build:docs-site
      - name: Build the proving-ground site
        run: bun run dogfood
      - name: Assemble the published tree
        run: bun tools/pages/assemble.mjs --root . --out dist/pages
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.ELISCRIPT_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
