name: Clean-machine onboarding

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-machine-onboarding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  onboarding:
    name: ubuntu-24.04-emacs-30.2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master@2026-08-28
        with:
          version: "30.2"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Execute documented clean-machine path
        run: >-
          bun tools/onboarding/check.mjs --run
          --json-output "$RUNNER_TEMP/m13-02.json"
          --markdown-output "$RUNNER_TEMP/m13-02.md"
      - name: Retain onboarding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m13-02-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m13-02.json
            ${{ runner.temp }}/m13-02.md
          if-no-files-found: error
          retention-days: 90
