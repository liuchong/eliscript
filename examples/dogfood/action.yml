name: dogfood
description: >-
  Build a static blog from repository Markdown, GitHub Issues, and GitHub
  Discussions, with native and external comment channels.
author: liuchong

branding:
  icon: book-open
  color: green

inputs:
  config-file:
    description: Repository-relative Eliscript configuration file.
    required: false
    default: dogfood.config.eli
  output-directory:
    description: >-
      Static output destination, relative to the repository root. Overrides
      output.directory in the configuration.
    required: false
    default: _site
  force:
    description: Bypass the no-change build skip and report reason=forced.
    required: false
    default: "false"
  github-token:
    description: >-
      Token for the Issues and Discussions providers. A public repository needs
      no token; a private one needs a token whose scopes cover it, and the
      configuration must acknowledge that its input reaches public output.
    required: false
  event-file:
    description: >-
      Path to the GitHub event payload, relative to the repository root.
      Defaults to the path in GITHUB_EVENT_PATH when the runner exports it.
      An event whose subject is a comment is deferred instead of built,
      because live channels are read in the reader's browser and snapshots
      come from the snapshot schedule.
    required: false
  preview:
    description: >-
      Render draft posts into a tree marked noindex, for a pull-request
      preview. Production output never includes drafts.
    required: false
    default: "false"
  previous-manifest:
    description: >-
      Path to the manifest recorded by the previous run. When given, the
      output tree is verified against it before it is replaced, so a run
      cannot delete output it did not produce.
    required: false

outputs:
  built:
    description: Whether a new site tree was produced.
  reason:
    description: One of changed, no-change, forced, deferred, or failed.
  content-fingerprint:
    description: Canonical digest of the rendered documents.
  output-directory:
    description: Path of the validated site artifact.
  post-count:
    description: Published canonical post count.
  comment-snapshot-count:
    description: >-
      Comment channels this build captured as a snapshot, counting hybrid
      channels, which ship one. A channel the reader loads from a provider is
      not counted.
  manifest:
    description: Path to the redacted build manifest.
  subject:
    description: >-
      What the triggering event was about: articles, comments, or unknown.
      Reported on a deferred run.
  cache-key:
    description: >-
      Cache key for the content fingerprint, suitable for actions/cache. The
      key changes exactly when the rendered documents change.

runs:
  using: node24
  main: dist/action/index.js
