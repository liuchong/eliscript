# Consumer workflow template.
#
# Copy this file to `.github/workflows/dogfood.yml` in the repository that
# holds the content. The Action builds and validates only; this workflow
# decides when it runs and when the result is deployed.
#
# The action reference is pinned to a full commit digest. The placeholder is
# resolved when the package is produced, so a copy always names a real commit.
#
# Event filters live here rather than in the configuration, because a
# configuration file cannot add workflow triggers. The `:event` comment policy
# is deliberately absent: per-comment triggering is opt-in and never generated
# by this template, since it lets an external commenter schedule work.
name: dogfood

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - "dogfood.config.eli"
      - ".github/workflows/dogfood.yml"
  # The snapshot schedule. It must match `refresh.snapshot-schedule` in the
  # configuration, and a change there is a change to this file.
  schedule:
    - cron: "37 */6 * * *"
  # A dispatch is a request, so it rebuilds whatever the policies would say.
  # `force` asks for a render even when the publishable inputs are unchanged.
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when nothing publishable changed.
        type: boolean
        default: false
  # Article carriers. Creation events are deliberately absent: neither
  # `issues.opened` nor `discussion.created` can be author-filtered before a
  # runner starts, so subscribing to them lets anyone who can open a record
  # spend runner capacity. A new record still reaches the site when a trusted
  # actor labels or edits it, when the schedule above picks it up, or when
  # someone dispatches a run. A repository that wants creation events anyway
  # can add them, and every created record will then start a runner.
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, transferred]
  discussion:
    types: [edited, labeled, unlabeled, closed, reopened, answered, unanswered]
  # There is deliberately no issue_comment or discussion_comment trigger here.
  # A new comment cannot change the site: live channels are read in the
  # reader's browser, and snapshot channels are captured by the schedule above.
  # Triggering per comment would spend a runner to decide it has nothing to do.
  # A repository that wants that anyway can add the trigger, and the build will
  # classify the run as deferred rather than rendering it.

# The workflow itself needs nothing but the repository it reads.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Least privilege per job: the build reads GitHub records and never holds a
    # deployment token.
    permissions:
      contents: read
      issues: read
      discussions: read
    # A newer content run may cancel an obsolete build; the deployment below is
    # outside this group so it is never interrupted once it starts.
    concurrency:
      group: dogfood-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      built: ${{ steps.build.outputs.built }}
      cache-key: ${{ steps.build.outputs.cache-key }}
    steps:
      # The build reads the working tree, not its history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      # Only the build manifest is restored. It is what tells the next run
      # whether the publishable inputs changed, and it is a few hundred bytes
      # rather than the whole site.
      - id: restore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc38249
        with:
          path: _site/_dogfood
          key: ${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            ${{ github.workflow }}-

      - id: build
        uses: liuchong/eliscript/examples/dogfood@PLACEHOLDER_ACTION_DIGEST
        with:
          config-file: dogfood.config.eli
          output-directory: _site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force || 'false' }}

      # A deferred or unchanged run produces no artifact, and uploading an
      # absent path would fail the job for the wrong reason.
      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

  # Deployment is a separate job in the protected environment, so a build that
  # runs for an untrusted event never holds a deployment token.
  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployment is serialized and never cancelled: an interrupted deployment
    # leaves the published site in a state nobody chose.
    concurrency:
      group: dogfood-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
